# Memory is capped deliberately. The defaults, and the 3GB heap this file used
# to carry, are sized for a build machine rather than a laptop also running a
# browser and an emulator. Stacking a 3GB Gradle daemon, unbounded Kotlin
# daemons and a 3GB emulator on a 15GB machine with 2GB of swap exhausted it.
#
# This project compiles comfortably in half of what was set before.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Bounded explicitly: the Kotlin compile daemon is a separate JVM from Gradle's
# and inherits no limit from the line above.
kotlin.daemon.jvmargs=-Xmx1024m

# Parallel execution spawns a worker per module and, in practice here, more than
# one Kotlin daemon at a time. A single-module project gains almost nothing from
# it and pays for it in resident memory.
org.gradle.parallel=false
org.gradle.workers.max=2

org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
